name: flutter_soletreme
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  animated_text_kit: ^4.3.0
  cached_network_image: ^3.4.1
  dio: ^5.9.2
  flutter_countdown_timer: ^4.1.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  flutter_spinkit: ^5.2.2
  just_audio: ^0.10.5
  url_launcher: ^6.3.2
  mobx: ^2.6.0
  flutter_mobx: ^2.3.0
  freezed_annotation: ^3.1.0
  json_annotation: ^4.11.0
  get_it: ^9.2.1
  shared_preferences: ^2.5.4
  flutter_markdown_plus: ^1.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.10.4
  mobx_codegen: ^2.7.6
  json_serializable: ^6.13.0
  freezed: ^3.2.5
  

flutter:
  uses-material-design: true

  assets:
    - assets/data/
    - assets/images/
    - assets/sounds/
    - assets/icon.png

  fonts: 
    - family: RubikMonoOne
      fonts:
        - asset: fonts/RubikMonoOne-Regular.ttf    
    - family: Lora
      fonts:
        - asset: fonts/Lora.ttf
